<!DOCTYPE html>
<html>
<head>
    <title>Simple Thebe Test</title>
    <script src="https://unpkg.com/thebe@0.8.2/lib/index.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log("Simple test page loaded");
            
            // Enhance the test cell
            const cell = document.getElementById('test-cell');
            cell.setAttribute('data-executable', 'true');
            cell.setAttribute('data-language', 'python');
            
            // Initialize Thebe with basic config
            thebelab.bootstrap({
                binderOptions: {
                    repo: "binder-examples/jupyter-stacks-datascience",
                    ref: "master",
                },
                kernelOptions: {
                    name: "python3"
                },
                selector: "#test-cell",
                requestKernel: true
            });
            
            // Update status when ready
            thebelab.on('status', function(_, data) {
                document.getElementById('status').textContent = 'Status: ' + data.status;
                console.log('Thebe status:', data.status);
            });
        });
    </script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; }
    </style>
<script>
// Patched initThebe function
function initThebe() {
  console.log("Patched initThebe called");
  
  // First prepare all code cells
  const codeCells = document.querySelectorAll("pre");
  codeCells.forEach((cell, index) => {
    // Look for python code
    if (cell.textContent.includes("import") || 
        cell.textContent.includes("print") || 
        cell.textContent.includes("plt.") || 
        cell.textContent.includes("np.")) {
      
      cell.setAttribute("data-executable", "true");
      cell.setAttribute("data-language", "python");
      
      if (!cell.id) {
        cell.id = "cell-" + index;
      }
      console.log("Enhanced cell: " + cell.id);
    }
  });
  
  // Load thebe if needed
  if (typeof thebelab === "undefined") {
    console.log("Loading Thebe from CDN");
    const script = document.createElement("script");
    script.src = "https://unpkg.com/thebe@0.8.2/lib/index.js";
    
    script.onload = function() {
      startThebe();
    };
    
    document.head.appendChild(script);
  } else {
    startThebe();
  }
  
  function startThebe() {
    thebelab.bootstrap({
      binderOptions: {
        repo: "binder-examples/jupyter-stacks-datascience",
        ref: "master",
      },
      kernelOptions: {
        name: "python3",
        path: "./notebooks"
      },
      selector: "pre[data-executable='true']",
      requestKernel: true,
      mountActivateWidget: true
    });
    
    // Update loading messages
    document.querySelectorAll(".loading-text").forEach(el => {
      el.textContent = "Ready";
    });
    
    console.log("Thebe initialized with patched function");
  }
}
</script>
<script>
// Define a safer initThebeSBT function with the plotly-enabled repository
window.initThebeSBT = function() {
  console.log("Safe initThebeSBT called - using updated repository with plotly");
  
  // First prepare all code cells
  const codeCells = document.querySelectorAll("pre");
  codeCells.forEach((cell, index) => {
    // Check if it looks like Python
    if (cell.textContent.includes("import") || 
        cell.textContent.includes("print") || 
        cell.textContent.includes("plt.") || 
        cell.textContent.includes("np.")) {
      
      cell.setAttribute("data-executable", "true");
      cell.setAttribute("data-language", "python");
      
      if (!cell.id) {
        cell.id = "cell-" + index;
      }
      console.log("Enhanced cell: " + cell.id);
    }
  });
  
  // Load thebe if needed
  if (typeof thebelab === "undefined") {
    console.log("Loading Thebe from CDN");
    const script = document.createElement("script");
    script.src = "https://unpkg.com/thebe@0.8.2/lib/index.js";
    
    script.onload = function() {
      bootstrapThebe();
    };
    
    document.head.appendChild(script);
  } else {
    bootstrapThebe();
  }
  
  function bootstrapThebe() {
    console.log("Bootstrapping Thebe with updated repository");
    thebelab.bootstrap({
      binderOptions: {
        repo: "pythondecal/plotly-dash-binder",
        ref: "master",
        binderUrl: "https://mybinder.org",
      },
      kernelOptions: {
        name: "python3",
        path: "./notebooks"
      },
      selector: "pre[data-executable='true']",
      requestKernel: true,
      mountActivateWidget: true
    });
    
    // Update button loading messages
    document.querySelectorAll(".loading-text").forEach(el => {
      el.textContent = "Connecting to Plotly-enabled Binder...";
    });
    
    // Listen for status changes
    thebelab.on("status", function(_, data) {
      console.log("Thebe status:", data.status);
      document.querySelectorAll(".loading-text").forEach(el => {
        el.textContent = data.status === "ready" ? "Ready!" : "Status: " + data.status;
      });
    });
  }
  
  return false; // Prevent default action
};

// Also patch the regular initThebe function for good measure
window.initThebe = window.initThebeSBT;
</script>
</head>
<body>
    <h1>Simple Thebe Test</h1>
    <p>This page uses a minimal, direct approach to initialize Thebe.</p>
    
    <div id="status">Status: initializing</div>
    
    <pre id="test-cell">
import numpy as np
import matplotlib.pyplot as plt

x = np.linspace(0, 10, 100)
y = np.sin(x)

plt.figure(figsize=(8, 4))
plt.plot(x, y)
plt.title('Simple Test')
plt.show()
    </pre>
</body>
</html>
