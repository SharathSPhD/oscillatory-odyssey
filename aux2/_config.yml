# Book settings
title: Oscillatory Odyssey
author: The Oscillatory Odyssey Team
logo: logo.png
copyright: "2025"

# Force re-execution of notebooks on each build
execute:
  execute_notebooks: force

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: oscillatory-odyssey.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/yourusername/oscillatory-odyssey
  path_to_book: ""
  branch: main

# Add GitHub buttons to your book
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  use_download_button: true
  home_page_in_navbar: true
  use_multitoc_numbering: true
  extra_navbar: ""
  extra_footer: ""
  google_analytics_id: ""
  announcement: "A Python package for exploring parametric pendulum physics"

# Launch button settings
launch_buttons:
  notebook_interface: jupyterlab
  binderhub_url: ""
  thebe: true

# Table of Contents structure
parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution
    - tasklist
  myst_url_schemes: [mailto, http, https]