# Book settings
title: Oscillatory Odyssey
author: Sharath Sathish, PhD
copyright: "2025"
logo: images/logo.png  # Update with your actual logo path

# Force re-execution of notebooks on each build
execute:
  execute_notebooks: force
  timeout: 300  # Increase timeout for complex simulations

# Define the repository
repository:
  url: https://github.com/SharathSPhD/oscillatory-odyssey
  branch: main

# HTML-specific settings
html:
  use_repository_button: true
  use_issues_button: true
  use_edit_page_button: false
  baseurl: /oscillatory-odyssey/
  extra_css:
    - _static/custom.css

# Launch button settings
launch_buttons:
  notebook_interface: classic
  thebe: true  # Enable Thebe for interactive code execution
  thebe_config:
    repository: SharathSPhD/oscillatory-odyssey
    ref: main

# Configure sphinx extensions for interactive content
sphinx:
  extra_extensions:
    - 'sphinx.ext.autodoc'
    - 'sphinx.ext.viewcode'
    - 'sphinx.ext.napoleon'
    - 'jupyter_sphinx'
    - 'sphinx_thebe'
  # Note: Removed plotly_sphinx_extension as it may cause compatibility issues
  config:
    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    html_theme_options:
      use_download_button: true
      repository_url: https://github.com/SharathSPhD/oscillatory-odyssey
      repository_branch: main
      use_issues_button: true
      use_repository_button: true
      launch_buttons:
        thebe: true

# Enable MyST extensions
parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution
    - tasklist

# Execution mode for notebooks
jupyter_execute_notebooks: force

# Thebe configuration for live code execution
thebe:
  always_load: true  # Load Thebe on every page
  kernel_name: "python3"  # Use Python 3 kernel
  repository_url: "https://github.com/SharathSPhD/oscillatory-odyssey"  # Your GitHub repo URL
  repository_branch: "main"  # Your branch name